name: qiuzhao

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: qiuzhao-web:latest
    env_file:
      - .env
    ports:
      # Only the host Nginx can reach Gunicorn. Do not change this to 0.0.0.0.
      - "127.0.0.1:${WEB_HOST_PORT:-5001}:8000"
    extra_hosts:
      # Lets MYSQL_HOST=host.docker.internal reach a MySQL service on the Ubuntu host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
